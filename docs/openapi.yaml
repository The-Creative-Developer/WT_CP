        - fileId
  headers:
    Location:
      description: Where the new resource can be found.
      schema:
        type: string
    SetRefreshCookie:
      description: "Sets the `dv_refresh` refresh token: httpOnly, SameSite=Lax, Path=/api/v1/auth, Secure in production."
      schema:
        type: string
    ClearRefreshCookie:
      description: Clears the `dv_refresh` cookie.
      schema:
        type: string
    CacheControlNoStore:
      description: "`no-store`: tokens and live data must not be cached."
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
    RateLimit:
      description: Requests left in the current window (IETF RateLimit header, draft 8).
      schema:
        type: string
      example: '"default";r=0;t=42'
    RateLimitPolicy:
      description: The limit that applies (IETF RateLimit-Policy header, draft 8).
      schema:
        type: string
      example: '"default";q=300;w=60'
    WWWAuthenticate:
      description: Which authentication scheme to use, and why the token was rejected.
      schema:
        type: string
      example: Bearer error="invalid_token"
    XRequestId:
      description: Identifies this request in the server logs. Sent with every response.
      schema:
        type: string
  responses:
    Unauthorized:
      description: Not signed in, or the access token is invalid or expired.
      headers:
        WWW-Authenticate:
          $ref: "#/components/headers/WWWAuthenticate"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content: &a1
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Signed in, but not allowed to do this.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content: *a1
    NotFound:
      description: No such resource (or route).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content: *a1
    Conflict:
      description: Clashes with the current state, such as a name that is already taken.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content: *a1
    ValidationFailed:
      description: The request was understood but its values are invalid. `errors` lists them by field.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content: *a1
    TooManyRequests:
      description: Rate limited. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimitPolicy"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content: *a1
    ServiceUnavailable:
      description: Temporarily overloaded. Try again after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content: *a1
