            - failed
          description: "`finished`: the program ran, whatever its verdict. `failed`: it could not be run."
        by:
          type: object
          properties:
            id:
              type: string
              pattern: ^[a-f\d]{24}$
              examples:
                - 6730c2f4e1b2a3c4d5e6f701
