        - stderr
        - verdict
        - exitCode
        - durationMs
        - truncated
        - error
        - createdAt
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
          examples:
            - about:blank
        title:
          type: string
          description: What went wrong, written for people.
          examples:
            - Room not found
        status:
          type: integer
          examples:
