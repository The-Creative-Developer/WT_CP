name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Server tests start a real in-memory MongoDB; cache its ~100 MB binary between runs.
      # (Restored after `npm ci`, which wipes node_modules.)
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      # The runner's sandbox tests start real containers; without these images they would be skipped.
      - name: Build sandbox images (Node, Python)
        run: sh runner/sandboxes/build.sh node python
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
