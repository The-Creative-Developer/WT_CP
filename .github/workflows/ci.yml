name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Server tests start a real in-memory MongoDB; cache its ~100 MB binary between runs.
      # (Restored after `npm ci`, which wipes node_modules.)
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/mongodb-memory-server
          key: mongodb-binary-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      # The runner's sandbox tests start real containers; without these images they would be skipped.
      - name: Build sandbox images
        run: sh runner/sandboxes/build.sh
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  # Builds the production images (docs/deployment.md), so a broken Dockerfile is caught here rather than on the VM.
  # Runs alongside `verify`; nothing is pushed anywhere.
  images:
    runs-on: ubuntu-latest
    env:
      # Placeholders: docker-compose.prod.yml refuses to load without them, but building doesn't use them.
      PUBLIC_URL: https://ci.invalid
      MONGODB_URI: mongodb://ci.invalid/devverse
      JWT_ACCESS_SECRET: ci-placeholder
      JWT_REFRESH_SECRET: ci-placeholder
      RUNNER_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: docker compose -f docker-compose.prod.yml build
