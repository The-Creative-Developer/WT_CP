# Production stack for the VM (PLAN §4, option B). See docs/deployment.md. Start or update with:
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Settings and secrets come from deploy/.env (copy deploy/.env.example). Each service gets only the variables it
# needs: the runner never sees the database address or the JWT secrets.

# Its own project name, so it never mixes with the local dev stack (docker-compose.yml) in the same folder.
name: devverse-prod

services:
  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in deploy/.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep them, or Let's Encrypt rate limits bite after a few rebuilds
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [public]
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in deploy/.env}
      # One origin for the SPA and the API, so it is the only one allowed (CORS, Socket.IO and Yjs Origin checks).
      CORS_ORIGINS: ${PUBLIC_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in deploy/.env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in deploy/.env}
      RUNNER_URL: http://runner:5050
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in deploy/.env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Handed to browsers by GET /api/v1/turn-credentials, with credentials signed by the shared secret.
      TURN_URLS: turn:${TURN_HOST:?set TURN_HOST in deploy/.env}:3478?transport=udp,turn:${TURN_HOST}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in deploy/.env}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    # public: reachable by Caddy and able to reach MongoDB Atlas. internal: reaches the runner.
    networks: [public, internal]
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    environment:
      PORT: 5050
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      MAX_CONCURRENT_RUNS: 2
      # The runner writes each program here, then the host's Docker mounts it into a sandbox. Docker resolves that
      # mount path on the host, so the folder must have the same path inside and outside this container.
      RUNS_DIR: ${RUNS_DIR:-/var/lib/devverse/runs}
    volumes:
      # [CONCEPT: Docker Socket] Control of the host's Docker, needed to start sandboxes. Equivalent to root on the
      # host, so only this container has it: no published port, and only the API can reach it.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNS_DIR:-/var/lib/devverse/runs}:${RUNS_DIR:-/var/lib/devverse/runs}
    networks: [internal]
    restart: unless-stopped

  # [CONCEPT: TURN] Relays call media between browsers that can't reach each other directly (strict NATs, networks
  # that block UDP). Credentials are short-lived and checked against the API's shared secret, so it isn't an open
  # relay. See docs/webrtc.md.
  turn:
    image: coturn/coturn:4.18.0
    # Host networking: every relayed call needs its own UDP port, and publishing a range of ports through Docker's
    # proxy is slow. coturn listens on 3478 (UDP and TCP) and relays on 49160-49200.
    network_mode: host
    command:
      - -n # no config file: everything is below
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      # The VM is behind Azure's NAT: "<public IP>/<private IP>", so the relay addresses coturn hands out are public.
      - --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP in deploy/.env}
      - --realm=devverse
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --no-cli
      - --no-tls # TURN over TLS would need port 443, which Caddy has
      - --no-dtls
      - --no-multicast-peers
      - --no-software-attribute
      # Limits: 12 relays per user (3 peers × audio/video, with room to spare), 100 in all, ~1.5 Mbps each.
      - --user-quota=12
      - --total-quota=100
      - --max-bps=1500000
      # [CONCEPT: SSRF] Without these, anyone with credentials could use the relay to reach addresses inside the VM's
      # network: localhost, the private subnet, and Azure's metadata and platform endpoints.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=168.63.129.16
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=224.0.0.0-255.255.255.255
      - --denied-peer-ip=::1
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
    restart: unless-stopped

networks:
  public: {}
  # No route to the internet or the host's network: only containers on it can talk to each other.
  internal:
    internal: true

volumes:
  caddy-data: {}
  caddy-config: {}
